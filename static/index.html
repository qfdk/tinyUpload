<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="简单、安全的文件上传服务，支持拖拽上传和命令行操作">
    <meta name="theme-color" content="#1da1f2">
    <title>{{.ServerHost}} - 简单上传, Simple Is Beautiful</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
    <script>
        (function () {
            var theme;
            try { theme = localStorage.getItem('theme'); } catch (e) {}
            if (theme !== 'light' && theme !== 'dark') {
                theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <link rel="stylesheet" href="static/style.css?v={{.AssetVer}}">
</head>
<body>
<div class="top-controls">
    <div class="lang-select-wrap">
        <select id="langSwitch" aria-label="Language">
            <option value="zh">简体中文</option>
            <option value="en">English</option>
            <option value="fr">Français</option>
        </select>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Theme">🌙</button>
</div>
<header class="site-header">
    <h1 class="site-title">
        <span class="logo" aria-hidden="true">📦</span>
        <span>{{.ServerHost}}</span>
    </h1>
    <p class="site-description" data-i18n="tagline">简单上传 · Simple Is Beautiful</p>
</header>

<div class="panel-switch" id="panelSwitch" role="tablist">
    <button class="active" type="button" data-panel="upload" data-i18n="cliUpload">上传</button>
    <button type="button" data-panel="cli" data-i18n="cliTitle">命令行</button>
</div>

<div class="panels">
    <div class="panels-track" id="panelsTrack">
        <main class="upload-area" id="dropZone" aria-label="Upload">
            <div class="upload-icon" aria-hidden="true">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 3v12"/>
                    <path d="m17 8-5-5-5 5"/>
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                </svg>
            </div>
            <p class="upload-hint" data-i18n="dropHint">拖拽、粘贴（⌘V），或点击上传</p>
            <input type="file" id="fileInput" aria-label="File" multiple>

            <div id="uploadProgress" aria-live="polite">
                <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                    <div class="progress-bar-fill"></div>
                </div>
                <div class="status-text"></div>
                <button class="button cancel-button" id="cancelButton" type="button" style="display: none" data-i18n="cancel">取消</button>
            </div>
        </main>

        <section class="cli-card" id="cliShortcuts">
            <div class="cli-titlebar" aria-hidden="true">
                <span class="dot dot-r"></span><span class="dot dot-y"></span><span class="dot dot-g"></span>
                <em data-i18n="cliTitle">命令行</em>
            </div>
            <div class="cli-lines">
                <div class="cli-line">
                    <span class="cli-tag tag-up" data-i18n="cliUpload">上传</span>
                    <code id="uploadCommand" tabindex="0">curl -T 文件名 {{.ServerHost}}</code>
                </div>
                <div class="cli-line">
                    <span class="cli-tag tag-down" data-i18n="cliDownload">下载</span>
                    <code id="downloadCommand" tabindex="0">curl -O {{.Protocol}}://{{.ServerHost}}/xxxx/文件名</code>
                </div>
                <div class="cli-line">
                    <span class="cli-tag tag-del" data-i18n="cliDelete">删除</span>
                    <code id="deleteCommand" tabindex="0">curl -X DELETE "{{.Protocol}}://{{.ServerHost}}/xxxx/文件名?code=删除码"</code>
                </div>
            </div>
        </section>
    </div>
</div>

<section class="upload-result" id="uploadResult" aria-live="polite" hidden>
    <button class="result-close" id="resultClose" type="button" aria-label="Close">×</button>
    <h3 data-i18n="uploadSuccess">上传成功</h3>
    <div id="resultContent"></div>
    <button class="button copy-button" id="copyButton" type="button" data-i18n="copyInfo">复制信息</button>
</section>

<p class="retention" data-i18n="retention">文件保存 3 天后自动删除</p>

<section class="file-list" id="fileList"></section>

<script src="static/app.js?v={{.AssetVer}}"></script>
<noscript>
    <div class="noscript-message">
        <h2>需要启用 JavaScript / JavaScript required</h2>
        <p>此页面需要启用 JavaScript 才能正常工作。您也可以使用命令行上传：</p>
        <code>curl -T 文件名 {{.ServerHost}}</code>
    </div>
</noscript>
</body>
</html>
